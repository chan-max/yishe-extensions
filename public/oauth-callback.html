<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>授权成功 - 一设设计</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 8px 32px rgb(0 0 0 / 10%);
      max-width: 360px;
      width: 90%;
    }
    .icon { font-size: 48px; margin-bottom: 16px; }
    h2 { font-size: 20px; color: #303133; margin-bottom: 8px; }
    p { font-size: 14px; color: #909399; margin-bottom: 24px; }
    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid #ebeef5;
      border-top-color: #409eff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { color: #f56c6c; }
    .success { color: #67c23a; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon" id="icon">⏳</div>
    <h2 id="title">正在处理授权...</h2>
    <p id="message">请稍候，正在完成登录</p>
    <div class="loading" id="loading"></div>
  </div>

  <script>
    async function handleCallback() {
      const icon = document.getElementById('icon')
      const title = document.getElementById('title')
      const message = document.getElementById('message')
      const loading = document.getElementById('loading')

      try {
        // 从 URL 提取授权码
        const urlParams = new URLSearchParams(window.location.search)
        const code = urlParams.get('code')
        const error = urlParams.get('error')

        if (error) {
          throw new Error(urlParams.get('error_description') || '授权被拒绝')
        }

        if (!code) {
          throw new Error('未获取到授权码')
        }

        // 通知 background script 处理
        const runtime = typeof chrome !== 'undefined' && chrome.runtime ? chrome.runtime : (typeof browser !== 'undefined' ? browser.runtime : null)
        if (!runtime) {
          throw new Error('未找到扩展运行时环境')
        }
        const response = await runtime.sendMessage({
          action: 'oauthCallback',
          code: code,
          redirectUri: window.location.origin + window.location.pathname
        })

        if (response?.success) {
          icon.textContent = '✅'
          title.textContent = '授权成功'
          message.textContent = '您可以关闭此页面，返回插件使用'
          loading.style.display = 'none'

          // 3 秒后自动关闭
          setTimeout(() => window.close(), 3000)
        } else {
          throw new Error(response?.error || '授权失败')
        }
      } catch (err) {
        icon.textContent = '❌'
        title.className = 'error'
        title.textContent = '授权失败'
        message.textContent = err.message || '请重试'
        loading.style.display = 'none'
      }
    }

    handleCallback()
  </script>
</body>
</html>
